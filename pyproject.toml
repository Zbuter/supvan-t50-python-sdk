[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supvan-t50"
version = "1.3.0"
description = "Pure Python BLE and native USB SDK for SUPVAN T50 label printers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["Pillow>=10.0", "qrcode>=7.4", "python-barcode>=0.15"]

[project.optional-dependencies]
ble = ["bleak>=2.0"]
usb = ["pyusb>=1.2", "libusb-package>=1.0.26; platform_system == 'Windows'"]
all = ["bleak>=2.0", "pyusb>=1.2", "libusb-package>=1.0.26; platform_system == 'Windows'"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
